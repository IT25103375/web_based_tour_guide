spring.main.allow-bean-definition-overriding=true

# ---------- profile ----------
# dev  = no login required, H2 console open, sample data seeded
# remove this line (or set to prod) to test with JWT + roles
spring.profiles.active=dev

# ---------- H2 database (file based -> data survives restarts) ----------
spring.datasource.url=jdbc:h2:file:./data/tourguide-db;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------- H2 web console -> http://localhost:8080/h2-console ----------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console