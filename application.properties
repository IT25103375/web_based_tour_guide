spring.main.allow-bean-definition-overriding=true
server.port=8090
jwt.secret="62f9d8567fc00544b8af08cc61c7fd778150258dc84f8c388a5ee9ecab2401aa"

# Enable the H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configure H2 to save data to a file in the project folder
